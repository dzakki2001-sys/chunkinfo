name: build-all
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.1", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: unzip -q '*.zip'
      - run: gradle build -Pmc=${{ matrix.mc }}
        working-directory: chunkinfo
      - uses: actions/upload-artifact@v4
        with:
          name: chunkinfo-${{ matrix.mc }}
          path: chunkinfo/build/libs/*.jar
  merge:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: all-jars
          pattern: chunkinfo-*
